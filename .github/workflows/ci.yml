name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  # ==========================================================
  # BACKEND + POSTGIS + SPATIAL TESTS
  # ==========================================================

  backend:
    name: Backend & Spatial Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5

        env:
          POSTGRES_DB: ulpin
          POSTGRES_USER: ulpin
          POSTGRES_PASSWORD: ulpin_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ulpin -d ulpin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ulpin:ulpin_test_password@localhost:5432/ulpin
      CORS_ORIGINS: http://localhost:5173

    steps:
      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      # ------------------------------------------------------
      # Database bootstrap
      # ------------------------------------------------------

      - name: Initialize database schema
        run: |
          psql "$DATABASE_URL" -f database/schema.sql

      - name: Load deterministic synthetic seed
        run: |
          psql "$DATABASE_URL" -f database/seed.sql

      # ------------------------------------------------------
      # Neighborhood schema
      # ------------------------------------------------------

      - name: Apply neighborhood migration
        run: |
          psql "$DATABASE_URL" -f database/migrations/001_neighborhood_osm.sql

      # ------------------------------------------------------
      # Deterministic real-building fixture
      #
      # CI deliberately does NOT call the live Overpass API.
      #
      # This fixture reproduces the minimum OSM-derived
      # Raheja Tower record required by spatial tests.
      # ------------------------------------------------------

      - name: Load deterministic Raheja fixture
        run: |
          psql "$DATABASE_URL" -f tests/fixtures/raheja_tower.sql

      # ------------------------------------------------------
      # Vertical model
      #
      # This migration derives RAHEJA-F01 ... RAHEJA-F15
      # from the fixture's real-source footprint, height,
      # and mapped level count.
      # ------------------------------------------------------

      - name: Apply Raheja vertical model
        run: |
          psql "$DATABASE_URL" -f database/migrations/002_raheja_vertical_model.sql

      # ------------------------------------------------------
      # Tests
      # ------------------------------------------------------

      - name: Run backend and spatial tests
        run: |
          python -m pytest -v

  # ==========================================================
  # FRONTEND QUALITY GATES
  # ==========================================================

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Node
      # ------------------------------------------------------

      - name: Set up Node
        uses: actions/setup-node@v4

        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------
      # Quality gates
      # ------------------------------------------------------

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build