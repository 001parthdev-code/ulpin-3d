services:
  db:
    image: postgis/postgis:17-3.5
    container_name: ulpin-postgis

    environment:
    POSTGRES_DB: ${POSTGRES_DB:-ulpin}
    POSTGRES_USER: ${POSTGRES_USER:-ulpin}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ulpin_dev_password}

    ports:
      - "5432:5432"

    volumes:
      - ulpin_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
  test:
    [
      "CMD-SHELL",
      "pg_isready -U ${POSTGRES_USER:-ulpin} -d ${POSTGRES_DB:-ulpin}"
    ]
  interval: 5s
  timeout: 5s
  retries: 10

    restart: unless-stopped

volumes:
  ulpin_postgres_data: